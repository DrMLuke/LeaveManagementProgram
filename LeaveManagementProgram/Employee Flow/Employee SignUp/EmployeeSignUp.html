<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Employee Sign Up - HR Leave Management</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Khula:wght@400;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    min-height:100vh;
    overflow:hidden;
    font-family:'Khula',sans-serif;
    background:linear-gradient(
        180deg,
        #FF9F18 0%,
        #D54E00 100%
    );
}

/* BACKGROUND */

.background{
    position:fixed;
    inset:0;
    overflow:hidden;
}

.glow-dark{
    position:absolute;
    width:1200px;
    height:1200px;
    left:-450px;
    top:-350px;
    border-radius:50%;
    background:linear-gradient(
        180deg,
        #3A5A8F 24%,
        #111A29 100%
    );
    filter:blur(90px);
}

.glow-blue{
    position:absolute;
    width:1000px;
    height:1000px;
    left:-250px;
    top:-180px;
    border-radius:50%;
    background:linear-gradient(
        180deg,
        #333A73 0%,
        #50C4ED 100%
    );
}

/* LAYOUT */

.container{
    position:relative;
    z-index:10;

    width:100%;
    height:100vh;

    display:flex;
    justify-content:space-between;
    align-items:center;

    padding:60px 100px;
}

/* LEFT SIDE */

.left{
    flex:1;
    display:flex;
    justify-content:center;
    align-items:center;
}

.robot-image{
    width:450px;
    max-width:90%;
}

/* RIGHT SIDE */

.right{
    width:100%;
    max-width:520px;
}

.signup-card{

    background:#F8F8F8;

    border-radius:50px;

    padding:40px;

    border:2px solid #E5E5E5;

    box-shadow:
        0 20px 40px rgba(0,0,0,0.15);
}

.logo{
    font-size:14px;
    font-weight:700;
    color:#666;
    letter-spacing:2px;
    margin-bottom:12px;
}

h1{
    font-size:52px;
    color:#333A73;
    margin-bottom:5px;
}

.subtitle{
    font-family:'Inter',sans-serif;
    color:#666;
    margin-bottom:25px;
    font-size:14px;
}

.input-group{
    margin-bottom:14px;
}

input{

    width:100%;
    height:56px;

    border:2px solid #D9D9D9;
    border-radius:20px;

    padding:0 18px;

    font-size:15px;

    font-family:'Inter',sans-serif;

    outline:none;

    transition:.25s;
}

input:focus{
    border-color:#50C4ED;
}

.signup-btn{

    width:100%;
    height:60px;

    border:none;
    border-radius:20px;

    cursor:pointer;

    color:white;

    font-size:18px;
    font-weight:700;

    background:linear-gradient(
        180deg,
        #3A5B90 0%,
        #15233A 100%
    );

    transition:.25s;

    margin-top:10px;
}

.signup-btn:hover{
    transform:translateY(-2px);
}

.links{

    margin-top:22px;

    text-align:center;

    font-family:'Inter',sans-serif;
    font-size:14px;
}

.links a{
    color:#3A5A8F;
    text-decoration:none;
    font-weight:700;
}

.links a:hover{
    text-decoration:underline;
}

/* MOBILE */

@media(max-width:1100px){

    body{
        overflow:auto;
    }

    .container{
        flex-direction:column;
        justify-content:center;
        gap:30px;
        padding:30px;
    }

    .left{
        min-height:120px;
    }

    .right{
        max-width:520px;
    }

    h1{
        font-size:42px;
    }
}

</style>
</head>

<body>

<div class="background">
    <div class="glow-dark"></div>
    <div class="glow-blue"></div>
</div>

<div class="container">

    <!-- LEFT SIDE -->

    <div class="left">

        <!--

        ADD ROBOT PNG HERE LATER

        Example:

        <img src="images/robot.png">

        -->

    </div>

    <!-- RIGHT SIDE -->

    <div class="right">

        <div class="signup-card">

            <div class="logo">
                HR LEAVE MANAGEMENT SYSTEM
            </div>

            <h1>Sign Up</h1>

            <p class="subtitle">
                Create your employee account
            </p>

            <form>

                <div class="input-group">
                    <input
                        type="text"
                        placeholder="Full Name"
                        required>
                </div>

                <div class="input-group">
                    <input
                        type="email"
                        placeholder="Work Email"
                        required>
                </div>

                <div class="input-group">
                    <input
                        type="text"
                        placeholder="Employee ID"
                        required>
                </div>

                <div class="input-group">
                    <input
                        type="password"
                        placeholder="Password"
                        required>
                </div>

                <div class="input-group">
                    <input
                        type="password"
                        placeholder="Confirm Password"
                        required>
                </div>

                <!-- ACCOUNT CREATION DESTINATION -->
                <button
                    type="button"
                    class="signup-btn"
                    onclick="window.location.href='ADD_ACCOUNT_CREATION_DESTINATION_HERE.html'">

                    Create Account

                </button>

            </form>

            <div class="links">

                Already have an account?

                <!-- LOGIN PAGE -->
                <a href="ADD_LOGIN_PAGE_HERE.html">

                    Log In

                </a>

            </div>

        </div>

    </div>

</div>

</body>
</html>
<!-- Luke Moran -->
